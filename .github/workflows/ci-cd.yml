
name: YOTI Frontend CI/CD

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build YOTI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build Docker image
        run: docker build -t yoti-frontend:${{ github.sha }} .
