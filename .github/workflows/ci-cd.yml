name: YOTI Frontend CI/CD

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

# Workflow permissions
permissions:
  contents: read
  id-token: write

jobs:
  # Continuous Integration (CI) job to test and build the YOTI frontend
  test-and-build:
    name: Test and Build YOTI
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Build Docker image
        run: docker build -t yoti-frontend:${{ github.sha }} .

  # Continuous Deployment (CD) job to deploy the YOTI frontend
  publish-image:
    name: Publish YOTI Image to Artifact Registry
    runs-on: ubuntu-latest

    needs: test-and-build

    # Only publish images when code is pushed to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: nexedge-infra-sp-einsteinium1
      GAR_LOCATION: us-central1
      GAR_REPOSITORY: yoti-repository
      IMAGE_NAME: yoti-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: projects/913348679076/locations/global/workloadIdentityPools/yoti-github-pool/providers/github-provider
          service_account: team-einsteinium-sa@nexedge-infra-sp-einsteinium1.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and tag Docker image
        run: |
          IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .

      - name: Push Docker image to Artifact Registry
        run: |
          IMAGE="${GAR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${GAR_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "$IMAGE"
